name: Verify Asian house foundations

on:
  push:
    paths:
      - .github/workflows/asian-house-foundations.yml
      - scripts/house_asian_script.lua
      - scripts/house_asian_split_catalog.lua
      - scripts/lib_house_asian_split.lua
      - scripts/lib_house_asian_stacks.lua
      - scripts/house_asian_stack_profiles.lua
      - tools/house_asian_split/stack_profiles.py
      - objects3d/house_asian.dae
      - tests/house_asian_stack*
      - tests/house_asian_split_assembly_test.lua
  pull_request:
    paths:
      - .github/workflows/asian-house-foundations.yml
      - scripts/house_asian_script.lua
      - scripts/house_asian_split_catalog.lua
      - scripts/lib_house_asian_split.lua
      - scripts/lib_house_asian_stacks.lua
      - scripts/house_asian_stack_profiles.lua
      - tools/house_asian_split/stack_profiles.py
      - objects3d/house_asian.dae
      - tests/house_asian_stack*
      - tests/house_asian_split_assembly_test.lua

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /tools/house_asian_split/
            /objects3d/house_asian.dae
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lua 5.1 test runtime
        run: python -m pip install lupa==2.8
      - name: Check generated geometry interfaces
        run: python tools/house_asian_split/stack_profiles.py --check
      - name: Check deterministic planning and actual-piece assembly
        run: python tests/house_asian_stacks_runtime_test.py
