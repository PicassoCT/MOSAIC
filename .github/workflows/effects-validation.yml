name: Effect startup and validation regressions

on:
  pull_request:
    paths:
      - 'scripts/lib_mosaic.lua'
      - 'scripts/lib_graphene_arc.lua'
      - 'scripts/lib_graphene_chute.lua'
      - 'scripts/parachutscript.lua'
      - 'scripts/tankscript.lua'
      - 'luaui/system.lua'
      - 'luaui/configs/mosaic_validation.lua'
      - 'luaui/widgets_mosaic/dbg_validation.lua'
      - 'luaui/widgets_mosaic/gfx_light_effects.lua'
      - 'luaui/widgets_mosaic/gfx_neonlights_radiancecascade.lua'
      - 'luaui/widgets_mosaic/gui_cityname.lua'
      - 'luaui/widgets_mosaic/include/combat_light_sources.lua'
      - 'luaui/widgets_mosaic/include/combat_light_renderer.lua'
      - 'luaui/widgets_mosaic/include/mobile_shadow_field.lua'
      - 'luaui/widgets_mosaic/include/mobile_shadow_sources.lua'
      - 'luaui/widgets_mosaic/include/radiance_scene.lua'
      - 'luaui/widgets_mosaic/include/tank_muzzle_flash.lua'
      - 'luaui/widgets_mosaic/shaders/radiancecascade/combat_emission.*'
      - 'luaui/widgets_mosaic/shaders/radiancecascade/mobile_shadow.glsl'
      - 'luaui/widgets_mosaic/shaders/radiancecascade/scene.frag'
      - 'luarules/gadgets/game_validation_session.lua'
      - 'luarules/gadgets/gfx_smoke_ribbons.lua'
      - 'luarules/gadgets/include/smoke_ribbon_*.lua'
      - 'luarules/gadgets/shaders/smokeRibbon.*'
      - 'tests/light_effects_widget_startup.lua'
      - 'tests/mobile_shadow_failure_lifecycle.lua'
      - 'tests/mobile_radiance_shadows_gpu.py'
      - 'tests/radiance_capture_state_gpu.py'
      - 'tests/city_geography_test.lua'
      - 'tests/validation_widget.lua'
      - 'tests/graphene_arcs_*'
      - 'tests/graphene_chute_gpu.py'
      - 'tests/smoke_ribbon_commands.lua'
      - 'tests/tank_muzzle_effects.lua'
      - 'tests/smoke_ribbons_lifecycle.lua'
      - '.github/workflows/effects-validation.yml'
  workflow_dispatch:

jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MESA_GL_VERSION_OVERRIDE: 3.3COMPAT
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            tests/
            units/
            weapons/
            luaui/*.lua
            luaui/configs/mosaic_validation.lua
            luaui/widgets_mosaic/dbg_validation.lua
            luaui/widgets_mosaic/gfx_light_effects.lua
            luaui/widgets_mosaic/gfx_neonlights_radiancecascade.lua
            luaui/widgets_mosaic/gui_cityname.lua
            luaui/widgets_mosaic/include/
            luaui/widgets_mosaic/shaders/
            luarules/*.lua
            luarules/gadgets/include/
            luarules/gadgets/shaders/
            luarules/gadgets/game_validation_session.lua
            luarules/gadgets/gfx_smoke_ribbons.lua
            luarules/gadgets/gfx_explosion_lights.lua
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua and headless shader dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 libegl1 libgl1 libgl1-mesa-dri
          python -m pip install moderngl numpy lupa
      - name: Verify real widget startup and manual validation commands
        run: |
          lua5.1 tests/light_effects_widget_startup.lua
          lua5.1 tests/mobile_shadow_failure_lifecycle.lua
          lua5.1 tests/city_geography_test.lua
          lua5.1 tests/validation_widget.lua
          lua5.1 tests/tank_muzzle_effects.lua
          lua5.1 tests/police_radiance_lifecycle.lua
          lua5.1 tests/combat_effects_lifecycle.lua
          lua5.1 tests/combat_effect_events.lua
      - name: Verify parachute attachments and existing ribbon lifecycles
        run: |
          lua5.1 tests/graphene_arcs_lifecycle.lua
          lua5.1 tests/smoke_ribbon_commands.lua
          lua5.1 tests/smoke_ribbons_lifecycle.lua
          lua5.1 tests/objective_ribbon_flames_lifecycle.lua
          lua5.1 tests/smoke_cigarette_lifecycle.lua
      - name: Render production electrical, smoke and combat shaders
        run: |
          python tests/graphene_arcs_gpu.py
          python tests/graphene_chute_gpu.py
          python tests/smoke_ribbons_gpu.py
          python tests/combat_light_gpu.py
          python tests/mobile_radiance_shadows_gpu.py
          python tests/radiance_capture_state_gpu.py
