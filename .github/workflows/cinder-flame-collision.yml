name: Cinder flame collision regression

on:
  pull_request:
    paths:
      - 'luaui/widgets_mosaic/include/pyro_flame_collision.lua'
      - 'luaui/widgets_mosaic/include/pyro_flame_budget.lua'
      - 'luaui/widgets_mosaic/include/combat_light_sources.lua'
      - 'luarules/gadgets/include/smoke_ribbon_renderer.lua'
      - 'luarules/gadgets/shaders/smokeRibbon.vert'
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - '.github/workflows/cinder-flame-collision.yml'
  workflow_dispatch:

jobs:
  visual-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid pulling the large DAE/texture assets for Lua-only checks.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/external-tests/
            /.github/mosaic-tests.ref
            /modinfo.lua
            /luaui/widgets_mosaic/include/
            /luaui/widgets_mosaic/shaders/
            luaui/widgets_mosaic/gfx_light_effects.lua
            /luarules/gadgets/include/
            /luarules/gadgets/shaders/
            luarules/gadgets/gfx_smoke_ribbons.lua
            luarules/gadgets/gfx_explosion_lights.lua
            luarules/gadgets/gfx_neonHolograms.lua
            weapons/walker_incendiary.lua
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Prepare pinned external tests
        uses: ./.github/actions/external-tests
      - name: Parse changed Lua modules and tests
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: |
          luac5.1 -p luaui/widgets_mosaic/include/pyro_flame_collision.lua
          luac5.1 -p luaui/widgets_mosaic/include/pyro_flame_budget.lua
          luac5.1 -p luaui/widgets_mosaic/include/combat_light_sources.lua
          luac5.1 -p luarules/gadgets/include/smoke_ribbon_renderer.lua
          luac5.1 -p tests/pyro_flame_collision_test.lua
          luac5.1 -p tests/cinder_flame_stream_test.lua
          luac5.1 -p tests/cinder_flame_budget_test.lua
      - name: Run collision and renderer regressions
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: |
          lua5.1 tests/pyro_flame_collision_test.lua
          lua5.1 tests/cinder_flame_stream_test.lua
          lua5.1 tests/cinder_flame_budget_test.lua
          lua5.1 tests/combat_effects_lifecycle.lua
          lua5.1 tests/smoke_ribbons_lifecycle.lua
