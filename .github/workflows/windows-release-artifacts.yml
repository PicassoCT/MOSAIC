name: Windows release artifacts

on:
  pull_request:
    paths:
      - 'tools/package_windows_release.py'
      - 'tools/qualify_windows_release.py'
      - 'tools/smoke_windows_portable.ps1'
      - 'tools/smoke_windows_portable.py'
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - 'tools/validate_performance_gate.py'
      - 'packaging/**'
      - 'pack_mosaic*.sh'
      - '.github/workflows/**'
      - 'scripts/lib_mosaic.lua'
      - 'modinfo.lua'
  push:
    branches: [master]
    paths:
      - 'tools/package_windows_release.py'
      - 'tools/qualify_windows_release.py'
      - 'tools/smoke_windows_portable.ps1'
      - 'tools/smoke_windows_portable.py'
      - 'tools/validate_performance_gate.py'
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - 'packaging/**'
      - 'pack_mosaic*.sh'
      - '.github/workflows/**'
      - 'scripts/lib_mosaic.lua'
      - 'modinfo.lua'
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Required game version (e.g. 1.036); must match the selected ref'
        required: true
        type: string
      portable:
        description: 'Build full portable bundle using committed packaging/windows-inputs.json'
        type: boolean
        default: true

# This workflow cannot create tags or GitHub Releases.
permissions:
  contents: read

env:
  CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          sparse-checkout: |
            .github
            tools
            packaging
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install 7-Zip for archive regression tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Prepare pinned external tests
        uses: ./.github/actions/external-tests
      - name: Packaging regression tests
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: python -m unittest discover -s tests -p test_windows_release.py -v
      - name: Performance gate regression tests
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: python -m unittest discover -s tests -p test_performance_gate.py -v
      - name: Release qualification regression tests
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: python -m unittest discover -s tests -p test_release_qualification.py -v

  artifacts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/windows-portable-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      portable: ${{ steps.build.outputs.portable }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install archive reader
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Build and validate artifacts
        id: build
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PORTABLE: ${{ github.event_name == 'pull_request' || inputs.portable }}
        shell: bash
        run: |
          args=(--output "$RUNNER_TEMP/mosaic-release")
          if [[ -n "$EXPECTED_VERSION" ]]; then
            args+=(--expected-version "$EXPECTED_VERSION")
          fi
          if [[ "$PORTABLE" == true ]]; then
            args+=(--inputs packaging/windows-inputs.json)
          fi
          python tools/package_windows_release.py "${args[@]}"
          echo "portable=$PORTABLE" >> "$GITHUB_OUTPUT"
      - name: Upload only successful build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mosaic-windows-release-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/mosaic-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-smoke:
    needs: artifacts
    if: needs.artifacts.outputs.portable == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          sparse-checkout: tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mosaic-windows-release-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/mosaic-artifacts
      - name: Verify portable binaries from a path with spaces
        shell: pwsh
        run: |
          ./tools/smoke_windows_portable.ps1 -ArtifactsDirectory "$env:RUNNER_TEMP/mosaic-artifacts" -OutputDirectory "$env:RUNNER_TEMP/MOSAIC smoke evidence"
      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mosaic-windows-smoke-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/MOSAIC smoke evidence/
          if-no-files-found: warn
          retention-days: 14
