name: Orbital arrival regression
on:
  pull_request:
    paths:
      - 'luaintro/Addons/bg_texture.lua'
      - 'luaui/widgets_mosaic/gfx_orbital_arrival.lua'
      - 'luaui/widgets_mosaic/include/orbital_arrival.lua'
      - 'luaui/widgets_mosaic/shaders/orbital_arrival_*.frag'
      - 'tests/orbital_arrival*'
      - '.github/workflows/orbital-arrival.yml'
  workflow_dispatch:
jobs:
  startup-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and headless GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shader test dependencies
        run: python -m pip install numpy
      - name: Verify frame-clock transitions and cleanup
        run: lua5.1 tests/orbital_arrival.lua
      - name: Compile and render production orbital shaders
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python tests/orbital_arrival_gpu.py
