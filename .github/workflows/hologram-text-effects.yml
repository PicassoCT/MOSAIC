name: Hologram text effects
on:
  push:
    paths:
      - scripts/tigLilAnimation.lua
      - scripts/lib_tiglil*.lua
      - scripts/lib_hologram_tiglil.lua
      - scripts/advertisingblimphologramscript.lua
      - objects3d/advertiseblimp_hologram.DAE
      - gamedata/unit_script_header.lua
      - units/neutral/house_western_hologram.lua
      - units/shared/text_fx_test.lua
      - scripts/text_fx_test_script.lua
      - scripts/lib_textFx.lua
      - scripts/house_western_hologram_script.lua
      - scripts/house_western_brothel_hologram_script.lua
      - objects3d/house_western_hologram.DAE
      - objects3d/house_western_brothel_hologram.DAE
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - .github/workflows/hologram-text-effects.yml
  pull_request:
    paths:
      - scripts/tigLilAnimation.lua
      - scripts/lib_tiglil*.lua
      - scripts/lib_hologram_tiglil.lua
      - scripts/advertisingblimphologramscript.lua
      - objects3d/advertiseblimp_hologram.DAE
      - gamedata/unit_script_header.lua
      - units/neutral/house_western_hologram.lua
      - units/shared/text_fx_test.lua
      - scripts/text_fx_test_script.lua
      - scripts/lib_textFx.lua
      - scripts/house_western*hologram_script.lua
      - objects3d/house_western_hologram.DAE
      - objects3d/house_western_brothel_hologram.DAE
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - .github/workflows/hologram-text-effects.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/external-tests/
            /.github/mosaic-tests.ref
            /modinfo.lua
            /scripts/
            /gamedata/unit_script_header.lua
            /units/shared/text_fx_test.lua
            /objects3d/advertiseblimp_hologram.DAE
            /objects3d/house_western_hologram.DAE
            /objects3d/house_western_brothel_hologram.DAE
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Prepare pinned external tests
        uses: ./.github/actions/external-tests
      - name: Check hologram text effects
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: |
          luac5.1 -p scripts/lib_textFx.lua scripts/house_western_hologram_script.lua scripts/house_western_brothel_hologram_script.lua
          lua5.1 tests/hologram_text_fx_test.lua
          python3 tests/hologram_text_axes_test.py
          lua5.1 tests/tiglil_motion_test.lua
          lua5.1 tests/tiglil_precision_test.lua
          lua5.1 tests/tiglil_solo_dance_test.lua
          python3 tests/tiglil_solo_dance_model_test.py
          lua5.1 tests/tiglil_pole_composition_test.lua
          lua5.1 tests/tiglil_pole_test.lua
          python3 tests/tiglil_pole_model_test.py
          lua5.1 tests/tiglil_flute_test.lua
          python3 tests/tiglil_flute_model_test.py
          lua5.1 tests/tiglil_retarget_test.lua
          python3 tests/tiglil_retarget_model_test.py
          lua5.1 tests/hologram_wall_impact_test.lua
          lua5.1 tests/hologram_spline_test.lua
          lua5.1 tests/hologram_slot_machine_test.lua
          lua5.1 tests/text_fx_speed_test.lua
          lua5.1 tests/text_fx_test_unit_test.lua
          lua5.1 tests/text_fx_tornado_stall_test.lua
