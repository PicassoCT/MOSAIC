name: Hologram text effects
on:
  push:
    paths:
      - scripts/lib_textFx.lua
      - scripts/house_western_hologram_script.lua
      - scripts/house_western_brothel_hologram_script.lua
      - tests/hologram_text_fx_test.lua
      - .github/workflows/hologram-text-effects.yml
  pull_request:
    paths:
      - scripts/lib_textFx.lua
      - scripts/house_western*hologram_script.lua
      - tests/hologram_text_fx_test.lua
      - .github/workflows/hologram-text-effects.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: |
          luac5.1 -p scripts/lib_textFx.lua scripts/house_western_hologram_script.lua scripts/house_western_brothel_hologram_script.lua
          lua5.1 tests/hologram_text_fx_test.lua
