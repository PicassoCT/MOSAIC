name: Peaceful city reconstruction
on:
  pull_request:
    paths:
      - 'luarules/configs/city_area.lua'
      - 'luarules/configs/civilian_daily_life.lua'
      - 'luarules/gadgets/game_spawnCity.lua'
      - 'luarules/gadgets/game_building_rubble_blocking.lua'
      - 'luarules/gadgets/game_building_block_damage.lua'
      - 'luarules/gadgets/game_damageHeatMap.lua'
      - 'luarules/gadgets/game_buildingPlacementLimitor.lua'
      - 'luarules/gadgets/include/city_*.lua'
      - 'scripts/house*.lua'
      - 'scripts/gCScrapHeap.lua'
      - 'scripts/safehousescript.lua'
      - 'scripts/lib_mosaic.lua'
      - 'scripts/lib_house_asian_split.lua'
      - 'luarules/gadgets/game_city_roads.lua'
      - 'scripts/lib_UnitScript.lua'
      - 'scripts/lib_building_damage.lua'
      - 'scripts/lib_building_voxels.lua'
      - 'units/neutral/gCScrapHeap.lua'
      - 'units/neutral/house_ruin.lua'
      - .github/mosaic-tests.ref
      - .github/actions/external-tests/**
      - '.github/workflows/city-reconstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/external-tests/
            /.github/mosaic-tests.ref
            /modinfo.lua
            /luarules/
            /luaui/widgets_mosaic/include/city_road_mesh.lua
            /luaui/widgets_mosaic/gui_city_roads.lua
            /scripts/
            /units/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - name: Prepare pinned external tests
        uses: ./.github/actions/external-tests
      - name: Lua 5.1 lifecycle, metadata, animation and occupancy regressions
        working-directory: ${{ runner.temp }}/mosaic-validation
        run: >-
          python -c "from pathlib import Path; from lupa.lua51 import LuaRuntime;
          [LuaRuntime().execute(Path(p).read_text()) for p in
          ['tests/city_reload_test.lua','tests/city_roads_test.lua','tests/house_asian_split_test.lua',
          'tests/city_reconstruction_test.lua','tests/city_area_events_test.lua',
          'tests/city_construction_animation_test.lua','tests/city_arcologies_test.lua',
          'tests/civilian_daily_life_invalid_targets_test.lua',
          'tests/civilian_reconstruction_blocking_test.lua',
          'tests/building_rubble_lifecycle_test.lua',
          'tests/building_block_damage_test.lua']]"
